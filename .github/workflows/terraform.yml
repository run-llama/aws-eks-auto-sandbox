name: Terraform

# Every PR (Renovate's included) must format and validate before review:
# run-llama/nuon pins this fork by commit, and the next sandbox reprovision
# of a customer install applies whatever main holds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt and validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [".", module, nuon_dns]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.0
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -diff

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        # The checked-in lock files pin provider versions but carry only macOS
        # hashes, so init adds the linux ones in the runner (not -lockfile=readonly).
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate
